interface:
  display_name: "Worldview Panel (Codex)"
  short_description: "Spawn worldview subagents to answer from multiple internet-archetype perspectives."
  default_prompt: "Analyze this with a worldview panel. Generate one run_id first and keep a concise top-level execution log with ../../tools/write_run_log.py. For component=worldview_panel, use this fixed stage skeleton: run_start; question_classify (domain,intent,risk); panel_select (persona_total,group_scope); material_prepare started/progress/completed with progress every 6 materials; context_prepare started/completed; dispatch_ready (ready,persona_total,batch_total, technical_gate); batch_start; agent_result for each certified persona; batch_end; progress_heartbeat; synthesis started/completed; run_end. run_end may only use completed/failed/incomplete. During batch waits, poll in 60s intervals and if nothing returns in 60s emit progress_heartbeat with phase, elapsed_sec, done, total. If a run has no run_end, treat it as incomplete rather than 'still thinking'. Pass the same --run-id into local plugin tools. In a local plugin, must generate runtime-backed persona materials before dispatch via ../../tools/persona_materials.py --persona <slug> --domain <domain> --run-id <run_id>; never hand-wave or manually omit [人格底盘材料] or [当前领域材料]. Build sealed worker inputs with ../../tools/build_worldview_round.py and dispatch only through ../../tools/run_worldview_broker.py. Do not hand-write worker prompts, do not create outgoing-copy style manual dispatches, and do not treat claim-only retrieval as a valid dispatch. Only technically certified broker results may enter synthesis, and if any broker step reports hash mismatch, schema invalid, or uncertified results, fail the run with the fixed user-facing message `这次请求已作废，请重新发准备好的上下文。`. Dispatch worldview subagents with fork_context=false, keep at most 6 active at a time, do not let persona subagents use tools, and synthesize with the built-in contrastive summary rules instead of stance buckets."
policy:
  allow_implicit_invocation: true
