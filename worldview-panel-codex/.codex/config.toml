# Project-scoped Codex defaults for the worldview panel.
# Delete the next two lines if you only want subagents pinned, but not the main thread.
model = "gpt-5.4"
model_reasoning_effort = "xhigh"
model_verbosity = "medium"

[agents]
# Keep the project thread budget above the worldview panel default so
# explicit user overrides like "同时启用 12 个 subagents" work without
# editing config again.
max_threads = 12
max_depth = 1
job_max_runtime_seconds = 1800
