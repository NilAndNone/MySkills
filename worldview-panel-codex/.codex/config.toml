# Project-scoped Codex defaults for the worldview panel.
# Delete the next two lines if you only want subagents pinned, but not the main thread.
model = "gpt-5.4"
model_reasoning_effort = "xhigh"
model_verbosity = "medium"

[agents]
# Keep some headroom for non-panel work. The worldview panel skill itself
# still caps active persona subagents at 3.
max_threads = 12
max_depth = 1
job_max_runtime_seconds = 1800
