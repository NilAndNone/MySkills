interface:
  display_name: "Worldview Panel (Codex)"
  short_description: "Spawn worldview subagents to answer from multiple internet-archetype perspectives."
  default_prompt: "Analyze this with a worldview panel. Prepare a closed task packet first. In a local bundle, must generate refs-backed persona materials before dispatch via tools/persona_materials.py --persona <slug> --domain <domain>; never hand-wave or manually omit [人格底盘材料] or [当前领域材料]. Dispatch worldview subagents with fork_context=false, keep at most 6 active at a time, do not let persona subagents use tools, and synthesize with the built-in contrastive summary rules instead of stance buckets."
policy:
  allow_implicit_invocation: true
